hypothesis: >
  Cryptocurrency exhibits time-series momentum: past positive returns predict
  continued positive returns over 2-4 day horizons. Vol-normalization (Moskowitz-Pedersen)
  improves risk-adjusted performance by reducing position size during high-vol regimes.
  H_null: E[net_return] = 0 for position = sign(return_N) × target_vol/realized_vol.
differs_from:
  HYP-K-001: >
    K-001 tested binary MA crossover signal with fixed position size: rejected (p=0.497/0.913).
    H16 tests: (1) return-sign signal (not price-level MA), (2) vol-scaled position (continuous),
    (3) shorter formation windows (12/24 bars vs 20/50 bars). Mechanically different.
