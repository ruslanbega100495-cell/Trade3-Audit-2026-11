id: HYP-H15
name: Funding Rate Carry — BTCUSDT (Systematic Premium Collection)
date: 2026-10-25
researcher: Ruslan
status: BACKTEST
hypothesis: >
  When BTCUSDT 8h funding rate (3-period rolling avg) exceeds +0.008%,
  systematic SHORT position earns funding premium from longs.
  When below -0.005%, LONG earns from shorts.
  H_null: E[net_return_including_funding] = 0.
differs_from:
  HYP-G-001: >
    G-001 tested PRICE REVERSAL after extreme funding (event study, gross price return only).
    H15 tests CARRY COLLECTION (funding premium + price), with explicit funding in return calculation.
    Mechanism: G-001 = market timing; H15 = systematic carry harvest.
    Thresholds: G-001 uses top/bottom 10% (>400x context); H15 uses absolute 0.008%/-0.005% thresholds.
funding_data_hash: 5b8057d195a7c8a9
ohlcv_data_hash: e182346101e28d26
signal:
  rolling_avg_periods: 3
  long_threshold: -0.005  # percent
  short_threshold: +0.008  # percent
  hold_bars: 2  # H4 bars = 8 hours
cost_model:
  taker_fee_pct: 0.055
  slippage_pct: 0.050
  funding: included_in_return
split:
  train: "2024-01-01 / 2025-04-01"
primary_metrics:
  - mean_net_return_per_trade
  - sharpe_ratio_annualized
  - max_drawdown
  - n_trades
results:
  train:
    n_trades: 761
    n_short: 735
    n_long: 26
    mean_price_return_pct: -0.0707
    mean_funding_earned_pct: +0.0146
    mean_cost_pct: 0.2100
    mean_net_return_pct: -0.2661
    total_net_pnl_pct: -202.5160
    sharpe_annualized: -4.174
    max_drawdown_pct: 212.6490
    win_rate: 0.390
    run_date: 2026-10-25
decision: REJECTED — funding earned (+0.0146%) insufficient vs price drag (-0.0707%) + round-trip costs (-0.21%). Sharpe=-4.174. SHORT-biased (735/761). H15 FAILS TO SHOW CARRY ADVANTAGE.
